version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - CLARUSMENS_ApiInfo__Contact__Name=Development Team
      - CLARUSMENS_ApiInfo__Contact__Email=dev-team@example.com
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/appuser/.microsoft/usersecrets:ro

  api-staging:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - CLARUSMENS_ApiInfo__Contact__Name=Staging Support
      - CLARUSMENS_ApiInfo__Contact__Email=staging-support@example.com
      - KeyVault__Url=https://your-keyvault.vault.azure.net/

  api-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - KeyVault__Url=https://your-keyvault.vault.azure.net/
    # In production, we'll use Azure Key Vault for sensitive data
